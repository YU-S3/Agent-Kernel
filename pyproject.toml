[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab"
version = "0.4.0"
description = "A generic plugin kernel and an independently composed reference Agent distribution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20", "PyYAML>=6.0", "aiohttp>=3.10.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "requests>=2.31"]

[project.scripts]
agentlab = "agentlab_app.cli:main"
agentkernel = "agentlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.package-data]
agentlab_app = ["static/*", "static/**/*", "catalog/**/*"]
